[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jevnexus"
version = "0.1.0"
description = "JevNexus — Decision-Centric Schema Matching (research codebase)"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "numpy", "pandas", "PyYAML", "requests", "torch", "transformers", "sentence-transformers",
    "huggingface_hub", "valentine>=1.0,<2", "rapidfuzz", "openpyxl", "json-repair",
    "scipy", "fuzzywuzzy", "mmh3", "scikit-learn", "python-dateutil",
]

[project.optional-dependencies]
test = ["pytest"]
plot = ["matplotlib"]

[project.urls]
Repository = "https://github.com/RazeenLI/DeMa"
Issues = "https://github.com/RazeenLI/DeMa/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
