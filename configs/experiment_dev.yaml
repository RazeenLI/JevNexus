# Fast-iteration subset: 5 evenly spaced cases per dataset (30 cases).
seed: 42
datasets:
- GDC
- ChEMBL
- Magellan
- OpenData
- TPC-DI
- WikiData
methods:
- coma
- coma_plus
- distribution
- similarity_flooding
- isresmat
- unicorn
- magneto_qwen
- jevnexus
- jevnexus_always
- jevnexus_no_rerank
- jevnexus_no_struct
- jevnexus_decision
- jevnexus_shared
resume: true
save_full_rankings: true
save_runtime: true
on_failure: continue
debug_max_cases: 3
smoke_test:
  cases:
  - dataset: GDC
    index: 0
  - dataset: OpenData
    index: 0
  methods:
  - coma
  - magneto_qwen
  - jevnexus
max_cases_per_dataset: 5
