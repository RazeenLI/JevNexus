seed: 42

datasets:
  - GDC
  - OpenData

methods:
  - coma_plus
  - isresmat
  - unicorn
  - magneto_qwen
  - jevnexus_shared

target_sizes:
  - 50
  - 100
  - 200
  - 400
  - 800

repeats: 3

# Cases per dataset to use (null = all cases of the dataset).
max_cases_per_dataset: 2

# When a target schema has fewer columns than a requested size, the
# (case, size) unit is recorded as "insufficient_columns" and skipped.
# No synthetic columns are ever added.

resume: true
on_failure: continue
